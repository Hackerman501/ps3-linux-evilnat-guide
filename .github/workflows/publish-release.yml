name: Publish guide release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example, v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      prerelease:
        description: "Mark this as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: main
          name: PS3 Linux Guide ${{ inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
